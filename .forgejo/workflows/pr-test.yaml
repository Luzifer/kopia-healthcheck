name: pr-test

on:
  push: {}
  workflow_dispatch: {}

jobs:
  test-and-build:
    defaults:
      run:
        shell: bash

    runs-on: forgejo

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run golangci-lint
        run: |
          golangci-lint run ./...

      - name: Run go test
        run: |
          go test -v -cover

      - name: Do a quick local build
        run: make build-local

      - name: Execute Trivy scan
        run: make trivy
