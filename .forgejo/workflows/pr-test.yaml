name: pr-test

on:
  push: {}
  workflow_dispatch: {}

jobs:
  test-and-build:
    defaults:
      run:
        shell: bash

    runs-on: forgejo

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run golangci-lint
        run: |
          golangci-lint run ./...

      - name: Run go test
        run: |
          go test -v -cover

      - name: Do a quick local build
        run: make build-local

      - name: Execute Trivy scan
        run: make trivy
